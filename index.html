<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO-MATRIX // PRO EDITION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           CSS VARIABLES — NEO-BRUTALIST SYSTEM
        ============================================================ */
        :root {
            /* Backgrounds */
            --bg:           #141414;
            --bg-raised:    #1c1c1c;
            --bg-card:      #1f1f1f;

            /* Borders */
            --border-w:     2.5px;
            --border:       #000;
            --border-color: #000;

            /* Shadows — hard offset, no blur */
            --shadow-sm:    3px 3px 0 #000;
            --shadow-md:    4px 4px 0 #000;
            --shadow-lg:    6px 6px 0 #000;
            --shadow-xl:    8px 8px 0 #000;

            /* Accent palette */
            --amber:        #F5A623;
            --amber-dark:   #c07d10;
            --green:        #22C55E;
            --green-dark:   #15803d;
            --red:          #EF4444;
            --red-dark:     #b91c1c;
            --blue:         #60A5FA;
            --purple:       #A78BFA;

            /* Rarity colours */
            --rarity-common-bg:    #1a2535;
            --rarity-common-fg:    #93B4D4;
            --rarity-common-bdr:   #4a7fa5;
            --rarity-rare-bg:      #2a1f00;
            --rarity-rare-fg:      #F5C842;
            --rarity-rare-bdr:     #c09a20;
            --rarity-epic-bg:      #1e1535;
            --rarity-epic-fg:      #C084FC;
            --rarity-epic-bdr:     #7c3aed;
            --rarity-mythic-bg:    #2a0a0a;
            --rarity-mythic-fg:    #F87171;
            --rarity-mythic-bdr:   #991b1b;

            /* Text */
            --text-primary:   #F0EDE6;
            --text-secondary: #9CA3AF;
            --text-muted:     #4B5563;

            /* Grid dot texture */
            --dot-color: rgba(255,255,255,0.04);

            /* Typography */
            --font-display: 'Bebas Neue', sans-serif;
            --font-body:    'Space Grotesk', sans-serif;
            --font-mono:    'Space Mono', monospace;

            /* Rounded corners — sturdy, not soft */
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;

            /* Spacing scale */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-5: 1.25rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-10: 2.5rem;
        }

        /* ============================================================
           RESET & BASE
        ============================================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html { height: 100%; font-size: 16px; }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(var(--dot-color) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* ============================================================
           SITE WRAPPER
        ============================================================ */
        .site-wrapper {
            width: 100%;
            max-width: 900px;
            padding: var(--space-6) var(--space-4) var(--space-10);
            display: flex;
            flex-direction: column;
            gap: var(--space-5);
        }

        /* ============================================================
           HEADER
        ============================================================ */
        .header {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .header-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--space-3);
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            background: var(--amber);
            color: #000;
            font-family: var(--font-mono);
            font-size: clamp(0.6rem, 1.5vw, 0.7rem);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: var(--space-1) var(--space-3);
            border: var(--border-w) solid var(--border);
            box-shadow: var(--shadow-sm);
            border-radius: var(--radius-sm);
        }

        .header-badge::before {
            content: '◉';
            font-size: 0.55rem;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header-title-block {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 8vw, 5.5rem);
            letter-spacing: 0.06em;
            line-height: 0.9;
            color: var(--text-primary);
        }

        .header-title .accent {
            color: var(--amber);
        }

        .header-sub {
            font-family: var(--font-mono);
            font-size: clamp(0.55rem, 1.5vw, 0.65rem);
            letter-spacing: 0.2em;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: var(--space-2);
        }

        .header-divider {
            height: var(--border-w);
            background: var(--border);
            width: 100%;
            position: relative;
        }

        .header-divider::after {
            content: '◆ INTERSECT & IDENTIFY ◆';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--font-mono);
            font-size: 0.5rem;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            background: var(--bg);
            padding: 0 var(--space-2);
        }

        /* ============================================================
           STATUS BAR
        ============================================================ */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--space-3);
            background: var(--bg-card);
            border: var(--border-w) solid var(--border);
            box-shadow: var(--shadow-md);
            border-radius: var(--radius-md);
            padding: var(--space-3) var(--space-4);
        }

        .stat-chip {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-family: var(--font-mono);
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .stat-value {
            font-family: var(--font-display);
            font-size: 1.5rem;
            letter-spacing: 0.05em;
            line-height: 1;
            color: var(--text-primary);
        }

        .stat-value.active  { color: var(--green); }
        .stat-value.loading { color: var(--amber); }
        .stat-value.offline { color: var(--red); }
        .stat-value.complete { color: var(--green); }

        .new-game-btn {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #000;
            background: var(--amber);
            border: var(--border-w) solid var(--border);
            box-shadow: var(--shadow-md);
            padding: var(--space-3) var(--space-5);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: transform 0.08s, box-shadow 0.08s;
            white-space: nowrap;
        }

        .new-game-btn:hover {
            background: #ffc04a;
        }

        .new-game-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 #000;
        }

        /* ============================================================
           BOARD WRAPPER
        ============================================================ */
        .board-outer {
            width: 100%;
        }

        .game-board {
            display: grid;
            grid-template-columns: minmax(90px, 140px) repeat(3, 1fr);
            grid-template-rows: minmax(90px, 140px) repeat(3, 1fr);
            gap: clamp(4px, 1vw, 8px);
            width: 100%;
        }

        /* ============================================================
           BASE CELL
        ============================================================ */
        .cell {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: clamp(8px, 2vw, 14px);
            border-radius: var(--radius-md);
            border: var(--border-w) solid var(--border);
            min-height: clamp(90px, 16vw, 150px);
            transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
        }

        /* ============================================================
           HEADER CELLS (row/col labels)
        ============================================================ */
        .cell.header {
            background: var(--bg-card);
            box-shadow: var(--shadow-sm);
        }

        .header-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            height: 100%;
        }

        .header-index {
            font-family: var(--font-mono);
            font-size: clamp(0.45rem, 1.2vw, 0.55rem);
            letter-spacing: 0.15em;
            color: var(--amber);
            text-transform: uppercase;
            background: rgba(245, 166, 35, 0.12);
            border: 1px solid rgba(245, 166, 35, 0.3);
            border-radius: var(--radius-sm);
            padding: 1px 6px;
        }

        .header-bar {
            width: 28px;
            height: 2px;
            background: var(--text-muted);
            border-radius: 1px;
        }

        .header-text {
            font-family: var(--font-body);
            font-size: clamp(0.65rem, 2vw, 0.85rem);
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.35;
            letter-spacing: 0.01em;
        }

        /* ============================================================
           CORNER CELL
        ============================================================ */
        .cell.empty-corner {
            background: var(--bg);
            border-color: transparent;
            box-shadow: none;
        }

        .corner-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-1);
        }

        .corner-logo-mark {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            color: var(--text-muted);
            letter-spacing: 0.08em;
            line-height: 1;
        }

        .corner-logo-sub {
            font-family: var(--font-mono);
            font-size: clamp(0.4rem, 1vw, 0.5rem);
            letter-spacing: 0.25em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* ============================================================
           PLAYABLE CELLS
        ============================================================ */
        .cell.playable {
            background: var(--bg-card);
            box-shadow: var(--shadow-md);
            cursor: pointer;
        }

        .cell.playable:hover {
            background: #252525;
            transform: translate(-2px, -2px);
            box-shadow: var(--shadow-lg);
        }

        .cell.playable:active {
            transform: translate(3px, 3px);
            box-shadow: var(--shadow-sm);
        }

        .cell-question {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--text-muted);
            line-height: 1;
        }

        .cell-coord {
            font-family: var(--font-mono);
            font-size: clamp(0.45rem, 1.2vw, 0.6rem);
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-top: var(--space-2);
            text-transform: uppercase;
        }

        /* ============================================================
           LOCKED / CORRECT CELL
        ============================================================ */
        .cell.locked {
            background: #0d3324;
            border-color: var(--green-dark);
            box-shadow: 4px 4px 0 var(--green-dark);
            cursor: default;
        }

        .cell.locked:hover {
            transform: none;
            box-shadow: 4px 4px 0 var(--green-dark);
        }

        .cell-flag {
            width: clamp(44px, 10vw, 68px);
            border-radius: var(--radius-sm);
            border: 1.5px solid rgba(255,255,255,0.12);
            margin-bottom: var(--space-2);
            display: block;
        }

        .cell-country-name {
            font-family: var(--font-body);
            font-size: clamp(0.55rem, 1.5vw, 0.7rem);
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
            letter-spacing: 0.01em;
        }

        /* ============================================================
           RARITY BADGE (top of locked cell)
        ============================================================ */
        .rarity-badge {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-mono);
            font-size: clamp(0.42rem, 1.1vw, 0.52rem);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: var(--radius-sm);
            border: 1.5px solid;
            white-space: nowrap;
            z-index: 2;
        }

        .rarity-badge.common  { background: var(--rarity-common-bg); color: var(--rarity-common-fg); border-color: var(--rarity-common-bdr); }
        .rarity-badge.rare    { background: var(--rarity-rare-bg);   color: var(--rarity-rare-fg);   border-color: var(--rarity-rare-bdr); }
        .rarity-badge.epic    { background: var(--rarity-epic-bg);   color: var(--rarity-epic-fg);   border-color: var(--rarity-epic-bdr); }
        .rarity-badge.mythic  { background: var(--rarity-mythic-bg); color: var(--rarity-mythic-fg); border-color: var(--rarity-mythic-bdr); }

        /* ============================================================
           HINT BUTTON (bottom-right of playable cell)
        ============================================================ */
        .hint-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: clamp(22px, 5vw, 28px);
            height: clamp(22px, 5vw, 28px);
            background: var(--bg-raised);
            border: var(--border-w) solid var(--border);
            box-shadow: 2px 2px 0 #000;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: clamp(0.55rem, 1.4vw, 0.7rem);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.12s, transform 0.08s, box-shadow 0.08s, background 0.1s;
            z-index: 5;
            line-height: 1;
        }

        .hint-btn:hover {
            color: var(--amber);
            background: #252525;
            border-color: var(--amber-dark);
        }

        .hint-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .hint-btn.loading {
            animation: blink 0.7s step-end infinite;
            pointer-events: none;
        }

        /* ============================================================
           HINT PANEL (inside modal)
        ============================================================ */
        .hint-panel {
            margin-top: var(--space-3);
            background: #0e1a10;
            border: var(--border-w) solid #1a3320;
            box-shadow: 3px 3px 0 #000;
            border-radius: var(--radius-md);
            padding: var(--space-3) var(--space-4);
            display: none;
        }

        .hint-panel.visible { display: block; }

        .hint-panel-label {
            font-family: var(--font-mono);
            font-size: 0.5rem;
            letter-spacing: 0.2em;
            color: var(--green);
            text-transform: uppercase;
            margin-bottom: var(--space-2);
            opacity: 0.7;
        }

        .hint-panel-text {
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .hint-panel-text.loading-text {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.75rem;
            animation: blink 1s step-end infinite;
        }

        /* ============================================================
           WRONG BLINK ANIMATION
        ============================================================ */
        @keyframes wrongBlink {
            0%   { background: var(--bg-card); border-color: var(--border); box-shadow: var(--shadow-md); }
            25%  { background: #3d1010; border-color: var(--red); box-shadow: 4px 4px 0 var(--red-dark); }
            50%  { background: var(--bg-card); border-color: var(--border); box-shadow: var(--shadow-md); }
            75%  { background: #3d1010; border-color: var(--red); box-shadow: 4px 4px 0 var(--red-dark); }
            100% { background: var(--bg-card); border-color: var(--border); box-shadow: var(--shadow-md); }
        }

        .cell.flash-wrong {
            animation: wrongBlink 0.7s ease;
        }

        /* ============================================================
           CELL ENTRANCE ANIMATION
        ============================================================ */
        @keyframes cellEntrance {
            from { opacity: 0; transform: translateY(8px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .game-board .cell.playable {
            animation: cellEntrance 0.35s ease both;
        }

        /* ============================================================
           LOCKED REVEAL
        ============================================================ */
        @keyframes cellReveal {
            0%   { opacity: 0; transform: scale(0.88); }
            60%  { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        .cell.locked {
            animation: cellReveal 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* ============================================================
           LOADING BLINK
        ============================================================ */
        .loading-cell .cell-question {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* ============================================================
           OVERLAY & MODAL
        ============================================================ */
        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            z-index: 200;
        }

        #overlay.active { display: block; }

        #search-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 300;
            width: min(500px, 94vw);
        }

        #search-modal.active { display: block; }

        .modal-frame {
            background: var(--bg-card);
            border: var(--border-w) solid var(--border);
            box-shadow: var(--shadow-xl);
            border-radius: var(--radius-lg);
            padding: var(--space-5) var(--space-5) var(--space-4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-4);
            gap: var(--space-3);
        }

        .modal-label {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: var(--amber);
            text-transform: uppercase;
            margin-bottom: var(--space-2);
        }

        .modal-criteria {
            font-family: var(--font-body);
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .modal-close-btn {
            background: var(--bg-raised);
            border: var(--border-w) solid var(--border);
            box-shadow: var(--shadow-sm);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.08s, box-shadow 0.08s, color 0.12s;
        }

        .modal-close-btn:hover {
            color: var(--red);
            border-color: var(--red);
        }

        .modal-close-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* ============================================================
           SEARCH INPUT
        ============================================================ */
        .input-wrapper {
            display: flex;
            align-items: center;
            border: var(--border-w) solid var(--border);
            box-shadow: var(--shadow-sm);
            background: var(--bg);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-3);
            overflow: hidden;
        }

        .input-prompt {
            padding: 0 var(--space-3);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--amber);
            flex-shrink: 0;
            border-right: var(--border-w) solid var(--border);
            height: 100%;
            display: flex;
            align-items: center;
            align-self: stretch;
            background: rgba(245, 166, 35, 0.07);
        }

        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            padding: var(--space-3) var(--space-4);
            caret-color: var(--amber);
        }

        #search-input::placeholder {
            color: var(--text-muted);
        }

        /* ============================================================
           SEARCH RESULTS
        ============================================================ */
        .search-results {
            max-height: 260px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--text-muted) transparent;
            border: var(--border-w) solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg);
        }

        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(10px, 2.5vw, 13px) var(--space-4);
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: background 0.1s;
            gap: var(--space-3);
        }

        .result-item:last-child { border-bottom: none; }

        .result-item:hover {
            background: #252525;
            border-left: 3px solid var(--amber);
            padding-left: calc(var(--space-4) - 1px);
        }

        .result-name {
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .result-id {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            letter-spacing: 0.12em;
            color: var(--text-muted);
        }

        .result-item.used {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .result-item.used:hover {
            background: transparent;
            border-left: none;
            padding-left: var(--space-4);
        }

        .used-tag {
            font-family: var(--font-mono);
            font-size: 0.55rem;
            letter-spacing: 0.15em;
            color: var(--amber-dark);
            background: rgba(245, 166, 35, 0.1);
            border: 1px solid rgba(245, 166, 35, 0.3);
            border-radius: var(--radius-sm);
            padding: 2px 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .no-results {
            padding: var(--space-5) var(--space-4);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
            letter-spacing: 0.1em;
        }

        /* ============================================================
           ERROR TOAST
        ============================================================ */
        .error-toast {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            color: var(--red);
            text-align: center;
            padding: var(--space-2) 0 0;
            min-height: 1.6em;
            transition: opacity 0.3s;
        }

        /* ============================================================
           SHAKE ANIMATION
        ============================================================ */
        @keyframes shake {
            0%   { transform: translate(-50%, -50%) translateX(0); }
            15%  { transform: translate(-50%, -50%) translateX(-10px); }
            30%  { transform: translate(-50%, -50%) translateX(10px); }
            45%  { transform: translate(-50%, -50%) translateX(-6px); }
            60%  { transform: translate(-50%, -50%) translateX(6px); }
            75%  { transform: translate(-50%, -50%) translateX(-3px); }
            100% { transform: translate(-50%, -50%) translateX(0); }
        }

        #search-modal.shake {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        /* ============================================================
           FOOTER
        ============================================================ */
        .footer {
            font-family: var(--font-mono);
            font-size: 0.55rem;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            text-align: center;
            text-transform: uppercase;
            padding: var(--space-6) var(--space-4);
        }

        /* ============================================================
           VICTORY RING
        ============================================================ */
        @keyframes victoryPulse {
            0%, 100% { box-shadow: 4px 4px 0 var(--green-dark); }
            50%       { box-shadow: 4px 4px 0 var(--green), 0 0 24px rgba(34, 197, 94, 0.35); }
        }

        .cell.locked.victory {
            animation: victoryPulse 1.2s ease-in-out infinite;
        }

        /* ============================================================
           RESPONSIVE: MOBILE
        ============================================================ */
        @media (max-width: 520px) {
            .site-wrapper {
                padding: var(--space-4) var(--space-3) var(--space-8);
                gap: var(--space-4);
            }

            .header-divider::after {
                display: none;
            }

            .status-bar {
                gap: var(--space-2);
                justify-content: space-between;
            }

            .stat-chip {
                flex: 1;
            }

            .new-game-btn {
                width: 100%;
                order: 3;
                text-align: center;
                justify-content: center;
            }

            .game-board {
                grid-template-columns: minmax(70px, 100px) repeat(3, 1fr);
                grid-template-rows: minmax(70px, 100px) repeat(3, 1fr);
                gap: 4px;
            }

            .cell {
                min-height: clamp(70px, 20vw, 110px);
                padding: 6px;
            }

            .header-text {
                font-size: clamp(0.58rem, 2.5vw, 0.75rem);
            }

            .cell-question {
                font-size: clamp(1.8rem, 6vw, 2.5rem);
            }

            .modal-frame {
                padding: var(--space-4);
            }

            #search-input {
                font-size: 0.9rem;
            }

            .result-name {
                font-size: 0.85rem;
            }
        }

        /* Tiny phones */
        @media (max-width: 360px) {
            .game-board {
                grid-template-columns: 64px repeat(3, 1fr);
                gap: 3px;
            }

            .cell {
                padding: 4px;
                min-height: 72px;
            }

            .header-index { display: none; }
            .header-bar   { display: none; }
            .cell-coord   { display: none; }

            .header-text {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- SITE WRAPPER -->
    <div class="site-wrapper">

        <!-- HEADER -->
        <header class="header">
            <div class="header-top-row">
                <div class="header-title-block">
                    <h1 class="header-title">GEO<span class="accent">·</span>MATRIX</h1>
                    <p class="header-sub">Geographical Intelligence Grid // Pro Edition</p>
                </div>
                <div class="header-badge">Infinity Mode Active</div>
            </div>
            <div class="header-divider"></div>
        </header>

        <!-- STATUS BAR -->
        <div class="status-bar">
            <div class="stat-chip">
                <span class="stat-label">Grid Status</span>
                <span class="stat-value loading" id="status-text">LOADING</span>
            </div>
            <button class="new-game-btn" onclick="loadBoard()">⟳ New Mission</button>
            <div class="stat-chip" style="text-align:right;">
                <span class="stat-label">Used Countries</span>
                <span class="stat-value" id="used-count">0</span>
            </div>
        </div>

        <!-- GAME BOARD -->
        <div class="board-outer">
            <div class="game-board" id="board"></div>
        </div>

        <!-- FOOTER -->
        <footer class="footer">Geo-Matrix Pro Edition // Offline-First Intelligence Engine</footer>

    </div><!-- /site-wrapper -->

    <!-- OVERLAY & MODAL -->
    <div id="overlay"></div>
    <div id="search-modal">
        <div class="modal-frame">
            <div class="modal-header">
                <div>
                    <div class="modal-label">⬡ Target Intersection</div>
                    <div class="modal-criteria" id="modal-title">—</div>
                </div>
                <button class="modal-close-btn" onclick="closeSearch()" aria-label="Close">✕</button>
            </div>

            <div class="input-wrapper">
                <span class="input-prompt">&gt;_</span>
                <input type="text" id="search-input" placeholder="Search country..." autocomplete="off" spellcheck="false">
            </div>

            <div class="search-results" id="search-results"></div>
            <div class="hint-panel" id="hint-panel">
                <div class="hint-panel-label">💡 AI Hint</div>
                <div class="hint-panel-text" id="hint-panel-text"></div>
            </div>
            <div class="error-toast" id="error-toast"></div>
        </div>
    </div>

    <script>
        const isLocalHost = location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.hostname === "";
        const API_URL = isLocalHost ? "http://127.0.0.1:8000/api" : "/api";

        let currentBoard  = null;
        let selectedCell  = null;
        let usedCountries = [];
        let solvedCount   = 0;

        /* ===================== STATUS ===================== */
        function setStatus(s) {
            const el = document.getElementById('status-text');
            el.textContent = s;
            el.className = 'stat-value';
            if (s === 'ACTIVE')    el.classList.add('active');
            else if (s === 'OFFLINE')  el.classList.add('offline');
            else if (s === 'COMPLETE') el.classList.add('complete');
            else                       el.classList.add('loading');
        }

        /* ===================== BOARD LOADING ===================== */
        async function loadBoard() {
            usedCountries = [];
            solvedCount   = 0;
            setStatus('ACQUIRING');
            document.getElementById('used-count').textContent = '0';

            try {
                const res  = await fetch(`${API_URL}/generate-board`);
                const data = await res.json();
                currentBoard = data.board;
                renderBoard();
                setStatus('ACTIVE');
            } catch(e) {
                setStatus('OFFLINE');
                renderError();
            }
        }

        /* ===================== RENDER BOARD ===================== */
        function renderBoard() {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';

            // Empty corner
            const corner = makeCell('empty-corner');
            corner.innerHTML = `<div class="corner-logo">
                <div class="corner-logo-mark">GM</div>
                <div class="corner-logo-sub">Pro Ed.</div>
            </div>`;
            boardDiv.appendChild(corner);

            // Column headers
            currentBoard.cols.forEach((col, i) => {
                const cell = makeCell('header');
                cell.innerHTML = `<div class="header-label">
                    <div class="header-index">COL-${String(i+1).padStart(2,'0')}</div>
                    <div class="header-bar"></div>
                    <div class="header-text">${col}</div>
                </div>`;
                boardDiv.appendChild(cell);
            });

            // Rows
            currentBoard.rows.forEach((row, ri) => {
                // Row header
                const rh = makeCell('header');
                rh.innerHTML = `<div class="header-label">
                    <div class="header-index">ROW-${String(ri+1).padStart(2,'0')}</div>
                    <div class="header-bar"></div>
                    <div class="header-text">${row}</div>
                </div>`;
                boardDiv.appendChild(rh);

                // Playable cells
                currentBoard.cols.forEach((col, ci) => {
                    const id   = `cell-${ri}-${ci}`;
                    const cell = makeCell('playable');
                    cell.id    = id;
                    cell.style.animationDelay = `${(ri * 3 + ci) * 55}ms`;
                    cell.innerHTML = `
                        <span class="cell-question">?</span>
                        <span class="cell-coord">${String.fromCharCode(65+ri)}${ci+1}</span>
                        <button class="hint-btn" title="Get a hint" onclick="requestHint(event, '${row}', '${col}')">?</button>`;
                    cell.onclick = () => openSearch(id, row, col, ri, ci);
                    boardDiv.appendChild(cell);
                });
            });
        }

        function renderError() {
            document.getElementById('board').innerHTML =
                `<div style="grid-column:1/-1;padding:3rem 1rem;text-align:center;color:var(--text-muted);font-family:var(--font-mono);font-size:0.75rem;letter-spacing:0.12em;line-height:2;">
                    ⚠ SIGNAL LOST — BACKEND OFFLINE<br>
                    <span style="font-size:0.6rem;color:var(--text-muted);">Ensure FastAPI is running on port 8000</span>
                </div>`;
        }

        function makeCell(...classes) {
            const el = document.createElement('div');
            el.className = 'cell ' + classes.join(' ');
            return el;
        }

        /* ===================== SEARCH MODAL ===================== */
        function openSearch(cellId, rowCat, colCat, ri, ci) {
            const cell = document.getElementById(cellId);
            if (cell.classList.contains('locked')) return;

            selectedCell = { id: cellId, row: rowCat, col: colCat, ri, ci };

            const rowLabel = `ROW ${String(ri+1).padStart(2,'0')}: ${rowCat}`;
            const colLabel = `COL ${String(ci+1).padStart(2,'0')}: ${colCat}`;
            document.getElementById('modal-title').innerHTML =
                `${rowLabel}<br><span style="color:var(--amber);">∩</span> ${colLabel}`;

            document.getElementById('search-results').innerHTML = '';
            document.getElementById('search-input').value = '';
            document.getElementById('error-toast').textContent = '';

            // Reset hint panel
            const hp = document.getElementById('hint-panel');
            hp.classList.remove('visible');
            document.getElementById('hint-panel-text').textContent = '';

            document.getElementById('search-modal').classList.add('active');
            document.getElementById('overlay').classList.add('active');
            setTimeout(() => document.getElementById('search-input').focus(), 50);
        }

        function closeSearch() {
            document.getElementById('search-modal').classList.remove('active');
            document.getElementById('search-modal').classList.remove('shake');
            document.getElementById('overlay').classList.remove('active');
        }

        document.getElementById('overlay').onclick = closeSearch;

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeSearch();
        });

        /* ===================== AUTOCOMPLETE ===================== */
        let debounceTimer;
        document.getElementById('search-input').addEventListener('input', e => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => doSearch(e.target.value), 120);
        });

        async function doSearch(q) {
            if (!q || q.length < 1) {
                document.getElementById('search-results').innerHTML = '';
                return;
            }
            try {
                const res  = await fetch(`${API_URL}/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                renderResults(data.results);
            } catch(e) {
                document.getElementById('search-results').innerHTML =
                    `<div class="no-results">Connection error</div>`;
            }
        }

        function renderResults(results) {
            const div = document.getElementById('search-results');
            if (!results.length) {
                div.innerHTML = `<div class="no-results">No matches found</div>`;
                return;
            }
            div.innerHTML = results.map(country => {
                const isUsed = usedCountries.includes(country.id);
                if (isUsed) {
                    return `<div class="result-item used">
                        <span class="result-name">${country.name}</span>
                        <span class="used-tag">USED</span>
                    </div>`;
                }
                return `<div class="result-item" onclick="submitGuess('${country.id}', '${escape(country.name)}')">
                    <span class="result-name">${country.name}</span>
                    <span class="result-id">${country.id}</span>
                </div>`;
            }).join('');
        }

        /* ===================== SUBMIT GUESS ===================== */
        async function submitGuess(cca3, countryName) {
            try {
                const res = await fetch(`${API_URL}/submit-guess`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        row_cat:        selectedCell.row,
                        col_cat:        selectedCell.col,
                        guess_cca3:     cca3,
                        used_countries: usedCountries
                    })
                });
                const result = await res.json();
                handleGuessResult(result, cca3);
            } catch(e) {
                showToast('SERVER UNREACHABLE');
            }
        }

        function handleGuessResult(result, cca3) {
            const cell = document.getElementById(selectedCell.id);

            if (result.correct) {
                usedCountries.push(cca3);
                solvedCount++;
                document.getElementById('used-count').textContent = usedCountries.length;

                const rarity = (result.rarity || 'Common').toLowerCase();
                const rarityLabel = result.rarity || 'Common';

                cell.classList.remove('playable');
                cell.classList.add('locked');
                cell.onclick = null;
                cell.innerHTML = `
                    <div class="rarity-badge ${rarity}">${rarityLabel}</div>
                    <img
                        class="cell-flag"
                        src="https://flagcdn.com/w80/${result.flag_cca2}.png"
                        alt="${result.country_name}"
                        onerror="this.style.display='none'"
                    >
                    <span class="cell-country-name">${result.country_name}</span>`;
                closeSearch();

                if (solvedCount === 9) onVictory();

            } else if (result.message === "Already on board!") {
                triggerShake();
                showToast('COUNTRY ALREADY DEPLOYED ON BOARD');
            } else {
                cell.classList.add('flash-wrong');
                setTimeout(() => cell.classList.remove('flash-wrong'), 800);
                closeSearch();
            }
        }

        function triggerShake() {
            const modal = document.getElementById('search-modal');
            modal.classList.remove('shake');
            void modal.offsetWidth;
            modal.classList.add('shake');
        }

        function showToast(msg) {
            const toast = document.getElementById('error-toast');
            toast.textContent = `⚠ ${msg}`;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        }

        /* ===================== VICTORY ===================== */
        function onVictory() {
            setStatus('COMPLETE');
            setTimeout(() => {
                const all = document.querySelectorAll('.cell.locked');
                all.forEach((c, i) => {
                    setTimeout(() => c.classList.add('victory'), i * 80);
                });
            }, 250);
        }

        /* ===================== HINT ===================== */
        async function requestHint(e, rowCat, colCat) {
            e.stopPropagation(); // Don't open the search modal

            // Open modal for context, pre-filling the categories
            const btn = e.currentTarget;
            // Find the cell to derive ri/ci
            const cellEl = btn.closest('.cell');
            const idParts = cellEl.id.replace('cell-', '').split('-');
            const ri = parseInt(idParts[0]);
            const ci = parseInt(idParts[1]);

            openSearch(cellEl.id, rowCat, colCat, ri, ci);

            // Show hint panel in loading state
            const hp = document.getElementById('hint-panel');
            const ht = document.getElementById('hint-panel-text');
            hp.classList.add('visible');
            ht.className = 'hint-panel-text loading-text';
            ht.textContent = 'Generating hint…';

            try {
                const res = await fetch(`${API_URL}/hint`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ row_cat: rowCat, col_cat: colCat })
                });
                const data = await res.json();
                ht.className = 'hint-panel-text';
                ht.textContent = data.hint || 'No hint available.';
            } catch(err) {
                ht.className = 'hint-panel-text';
                ht.textContent = '⚠ Could not load hint — server unreachable.';
            }
        }

        /* ===================== INIT ===================== */
        loadBoard();
    </script>
</body>
</html>
